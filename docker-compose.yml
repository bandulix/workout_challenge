# Workout Challenge - self-hosted fitness competitions with an AI Drill Instructor.
# Fork repository: https://github.com/bandulix/workout_challenge
#
# Quick start:
#   1. cp .env.example .env   (then edit - at minimum set POSTGRES_PASSWORD)
#   2. docker compose up -d --build
#
# All configuration is passed via the environment block below; every
# variable maps 1:1 to an entry in .env.example (keep the two in sync).
services:
  workoutchallenge:
    container_name: workoutchallenge
    build:
      context: .
      # Link the built image back to the fork repository (shows up in
      # `docker inspect` and registry UIs that understand OCI labels).
      labels:
        org.opencontainers.image.source: "https://github.com/bandulix/workout_challenge"
        org.opencontainers.image.title: "Workout Challenge"
        org.opencontainers.image.description: "Self-hosted fitness competitions with an AI Drill Instructor"
    labels:
      org.opencontainers.image.source: "https://github.com/bandulix/workout_challenge"
    ports:
      # The app port (nginx serves frontend + /api) - the only port that
      # should ever be reachable from outside. Behind a reverse proxy on
      # the same host: APP_BIND=127.0.0.1 and APP_PORT=<proxy target port>,
      # then point the proxy at 127.0.0.1:<APP_PORT>.
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-80}:80"
      # Celery Flower task monitoring (basic-auth protected, see below).
      # Localhost-only by default - reach it from the server itself or
      # via SSH port forwarding, e.g.
      #   ssh -L 5555:127.0.0.1:5555 user@your-vps
      # Set DEBUG_BIND=0.0.0.0 only on a trusted network.
      - "${DEBUG_BIND:-127.0.0.1}:5555:5555"    # Celery Flower task monitoring
      # NOT published, deliberately:
      #   9001 supervisord web UI - unauthenticated process control;
      #        loopback-only in the container now. Use
      #        `docker compose exec workoutchallenge supervisorctl -c /etc/supervisord.conf status`
      #   8000 gunicorn direct - bypasses the nginx security headers;
      #        binds loopback inside the container for nginx only.
    volumes:
      - django_data:/workout_challenge/src-backend/data
    environment:
      # --- Core Django ---
      # SECRET_KEY is required (like POSTGRES_PASSWORD): a known default
      # would let attackers forge sessions and password-reset tokens.
      # Generate one with:
      #   python3 -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())"
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY env var is required - see .env.example}
      # DEBUG defaults to false; opt into it explicitly for development.
      - DEBUG=${DEBUG:-false}
      - TIME_ZONE=${TIME_ZONE:-Europe/London}
      - REGISTRATION_TOKEN=${REGISTRATION_TOKEN:-}
      # How long users stay logged in WITHOUT opening the app (rolling
      # window - every app use re-extends it). Default 31 days.
      - JWT_REFRESH_DAYS=${JWT_REFRESH_DAYS:-31}
      - MAIN_HOST=${MAIN_HOST:-http://localhost}
      - HOSTS=${HOSTS:-http://localhost,http://127.0.0.1}
      # NOTE: in production set HOSTS to the comma-separated list of
      # public origins (e.g. https://workout.example.com,https://www.workout.example.com)
      # and DEBUG=false. There is intentionally no ALLOW_ALL_HOSTS escape
      # hatch any more - shipping that combination made credentialed
      # CORS requests trivially exploitable.

      # --- Postgres (matches the "database" service below) ---
      - POSTGRES_HOST=database
      - POSTGRES_DB=${POSTGRES_DB:-workoutchallenge}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env var is required}

      # --- Strava OAuth ---
      # Get these from https://www.strava.com/settings/api
      # Leave blank to disable the Strava link button in the UI.
      - STRAVA_CLIENT_ID=${STRAVA_CLIENT_ID:-000000}
      - STRAVA_CLIENT_SECRET=${STRAVA_CLIENT_SECRET:-}
      - STRAVA_LIMIT_15MIN=${STRAVA_LIMIT_15MIN:-100}
      - STRAVA_LIMIT_DAY=${STRAVA_LIMIT_DAY:-1000}

      # --- Garmin Connect ---
      # Optional explicit key for encrypting stored Garmin OAuth tokens
      # at rest. Falls back to a key derived from SECRET_KEY when unset -
      # set it if you rotate SECRET_KEY and want Garmin linkages to survive.
      - GARMIN_TOKEN_KEY=${GARMIN_TOKEN_KEY:-}

      # --- Email (SMTP) ---
      # Leave host/user/password blank to disable outbound email.
      # Outbound mail will fail silently; the app still works.
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-true}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-false}
      - EMAIL_FROM=${EMAIL_FROM:-workout@localhost}
      - EMAIL_REPLY_TO=${EMAIL_REPLY_TO:-}

      # --- LLM / AI provider (Drill Instructor + weekly email fact) ---
      # Either paste your API key here (and optionally pick a preset), or
      # leave blank and set it via the admin Site Settings UI later.
      # Examples:
      #   OpenAI:        OPENAI_API_KEY=sk-...                        (default)
      #   MiniMax:       LLM_PROVIDER=MiniMax + OPENAI_API_KEY=...    (preset auto-fills base URL + model)
      #   OpenRouter:    LLM_BASE_URL=https://openrouter.ai/api/v1 + OPENAI_API_KEY=sk-or-...
      #   Ollama local:  LLM_BASE_URL=http://host.docker.internal:11434/v1 + OPENAI_API_KEY=ollama
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_EMAIL_MODEL=${LLM_EMAIL_MODEL:-gpt-4o}

      # --- Sentry (optional error tracking) ---
      - SENTRY_DSN=${SENTRY_DSN:-}

      # --- Browser push (VAPID) ---
      # If left blank, a keypair is auto-generated on first boot and
      # persisted to django_data/vapid.json.
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@localhost}

      # --- Celery Flower (task monitoring on 127.0.0.1:5555) ---
      # Basic auth is mandatory - Flower exposes task payloads and
      # controls. Defaults the password to SECRET_KEY so no extra secret
      # needs managing; set FLOWER_USER/FLOWER_PASSWORD to override.
      - FLOWER_USER=${FLOWER_USER:-admin}
      - FLOWER_PASSWORD=${FLOWER_PASSWORD:-${SECRET_KEY:?SECRET_KEY env var is required}}
    restart: unless-stopped
    # Drop all capabilities and add back only what the stack needs:
    # NET_BIND_SERVICE (nginx on :80), SETUID/SETGID (supervisord
    # spawning workers as app/redis), CHOWN + DAC_OVERRIDE (entrypoint
    # fixing data-volume ownership).
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:15
    container_name: workoutchallenge-database
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-workoutchallenge}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env var is required}
    # No `ports:` block - Postgres is only reachable over the internal
    # compose network (POSTGRES_HOST=database). If you ever need host-side
    # psql access, run: docker compose exec database psql -U postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  django_data:
