<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8"/>
    <link rel="icon" href="/favicon.ico"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
    <meta name="theme-color" content="#0b0b0c"/>
    <meta name="description" content="Compete with friends and coworkers - with an AI Drill Instructor in your corner."/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="Drill"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="application-name" content="Workout Challenge"/>
    <meta name="format-detection" content="telephone=no"/>
    <!-- Hosted nginx CSP is tighter (connect-src same-origin + Sentry/Strava).
         This meta is the APK WebView's only CSP: scripts stay 'self';
         connect-src https: covers the configured API host. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"/>
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" sizes="any"/>
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32"/>
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16"/>
    <link rel="shortcut icon" href="/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
    <link rel="manifest" href="/manifest.json"/>
    <link rel="stylesheet" href="/fonts/fonts.css"/>
    <link rel="preload" href="/fonts/Inter-var.woff2" as="font" type="font/woff2" crossorigin="anonymous"/>
    <link rel="preload" href="/fonts/ArchivoBlack-400.woff2" as="font" type="font/woff2" crossorigin="anonymous"/>
    <!-- Today's backdrop is preloaded from theme-init.js (one plate per day). -->
    <script src="/config.js"></script>
    <!-- External file so CSP can run without script-src 'unsafe-inline'. -->
    <script src="/theme-init.js"></script>
    <title>Workout Challenge</title>
    <style>
        :root {
            --canvas: #0b0b0c;
            color-scheme: dark;
            --safe-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
            --safe-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
            --safe-left: var(--safe-area-inset-left, env(safe-area-inset-left, 0px));
            --safe-right: var(--safe-area-inset-right, env(safe-area-inset-right, 0px));
        }
        html { background: var(--canvas); }
        body, #root { background: transparent; }
        html {
            padding-top: var(--safe-top);
            padding-left: var(--safe-left);
            padding-right: var(--safe-right);
        }
        html, body { overscroll-behavior-y: none; }
        input, textarea, select { font-size: 16px; }
    </style>
</head>
<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="root"></div>
<script type="module" src="/src/index.js"></script>
</body>
</html>
