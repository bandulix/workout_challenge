<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <link rel="icon" href="/favicon.ico"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
    <meta name="theme-color" content="#0b0b0c"/>
    <meta name="description" content="Compete with friends and coworkers - with an AI Drill Instructor in your corner."/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="Drill"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="application-name" content="Workout Challenge"/>
    <meta name="format-detection" content="telephone=no"/>
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" sizes="any"/>
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32"/>
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16"/>
    <link rel="shortcut icon" href="/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
    <link rel="manifest" href="/manifest.json"/>
    <link rel="stylesheet" href="/fonts/fonts.css"/>
    <link rel="preload" href="/fonts/Inter-var.woff2" as="font" type="font/woff2" crossorigin="anonymous"/>
    <link rel="preload" href="/fonts/ArchivoBlack-400.woff2" as="font" type="font/woff2" crossorigin="anonymous"/>
    <link rel="preload" href="/login-bg.webp" as="image" type="image/webp"/>
    <script src="/config.js"></script>
    <!-- External file so CSP can run without script-src 'unsafe-inline'. -->
    <script src="/theme-init.js"></script>
    <title>Workout Challenge</title>
    <style>
        :root { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
        body { padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); }
        html, body { overscroll-behavior-y: contain; }
        input, textarea, select { font-size: 16px; }
        html { background: #dfe8c4; }
        html.dark { background: #0b0b0c; }
    </style>
</head>
<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="root"></div>
<script type="module" src="/src/index.js"></script>
</body>
</html>
