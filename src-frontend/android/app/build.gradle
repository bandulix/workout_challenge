apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Release signing ("sideload now, Play later"): credentials live
// OUTSIDE the repo in ~/.gradle/workout-signing.properties
// (storeFile/storePassword/keyAlias/keyPassword). assembleRelease
// FAILS without a real release keystore - never silently fall back to
// the debug key (that would ship debug-signed "release" artifacts).
def signingProps = new Properties()
def signingFile = file("${System.getProperty('user.home')}/.gradle/workout-signing.properties")
if (signingFile.exists()) {
    signingFile.withInputStream { signingProps.load(it) }
}
def hasReleaseSigning = signingProps['storeFile'] as boolean
if (!hasReleaseSigning) {
    // Only fail when a release variant is actually being built so
    // assembleDebug / IDE sync still works without a keystore.
    def taskNames = gradle.startParameter.taskNames.collect { it.toLowerCase() }
    def buildingRelease = taskNames.any { it.contains('releas') }
    if (buildingRelease) {
        throw new GradleException(
            "Release signing is required for assembleRelease. Create " +
            "~/.gradle/workout-signing.properties with storeFile, " +
            "storePassword, keyAlias, and keyPassword. " +
            "Debug builds (assembleDebug / build_apk.sh --debug) do not need it."
        )
    }
}

android {
    namespace = "com.bandulix.workoutchallenge"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.bandulix.workoutchallenge"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Stamped by scripts/build_apk.sh via -PversionName/-PversionCode
        // (git tag + commit count). Defaults keep bare checkouts buildable.
        versionCode Integer.parseInt(project.findProperty('versionCode')?.toString() ?: '1')
        versionName project.findProperty('versionName')?.toString() ?: 'dev'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
              // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
              // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (signingProps['storeFile']) {
                storeFile file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // No debug-keystore fallback: missing release signing fails above.
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    // Open Wearables Android SDK - reads Health Connect on-device and
    // syncs to our self-hosted instance (see OWHealthPlugin).
    implementation "com.github.the-momentum:open_wearables_android_sdk:v0.9.0"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
