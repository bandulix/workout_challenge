<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
    <meta name="theme-color" content="#0c4a6e" media="(prefers-color-scheme: light)"/>
    <meta name="theme-color" content="#0c4a6e" media="(prefers-color-scheme: dark)"/>
    <meta name="description" content="Compete with friends and coworkers across devices using the metrics you want, respecting your privacy."/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="Workout"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="application-name" content="Workout Challenge"/>
    <meta name="format-detection" content="telephone=no"/>
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/icon-192.svg" sizes="any"/>
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon-32x32.png" sizes="32x32"/>
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon-16x16.png" sizes="16x16"/>
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png"/>
    <link rel="apple-touch-icon" sizes="192x192" href="%PUBLIC_URL%/icon-192.svg"/>
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json"/>
    <script src="%PUBLIC_URL%/config.js"></script>
    <title>Workout Challenge</title>
    <style>
        /* Reserve safe-area for the iPhone notch / home indicator so
           the app doesn't render under them on first paint. */
        :root { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
        body { padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); }
        html, body { overscroll-behavior-y: contain; }
        /* Don't let iOS auto-zoom inputs on focus. */
        input, textarea, select { font-size: 16px; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 ">
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="root"></div>
</body>
</html>
