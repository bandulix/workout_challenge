<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
    <meta name="theme-color" content="#0a0d06"/>
    <meta name="description" content="Compete with friends and coworkers - with an AI Drill Instructor in your corner."/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="Drill"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="application-name" content="Workout Challenge"/>
    <meta name="format-detection" content="telephone=no"/>
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/icon-192.svg" sizes="any"/>
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon-32x32.png" sizes="32x32"/>
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon-16x16.png" sizes="16x16"/>
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png"/>
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json"/>
    <link rel="stylesheet" href="%PUBLIC_URL%/fonts/fonts.css"/>
    <link rel="preload" href="%PUBLIC_URL%/fonts/Inter-var.woff2" as="font" type="font/woff2" crossorigin="anonymous"/>
    <link rel="preload" href="%PUBLIC_URL%/fonts/ArchivoBlack-400.woff2" as="font" type="font/woff2" crossorigin="anonymous"/>
    <script src="%PUBLIC_URL%/config.js"></script>
    <script>
        // Apply the stored theme before first paint (class-based dark mode).
        (function () {
            try {
                var t = localStorage.getItem("wc-theme") || "system";
                var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
                document.documentElement.classList.toggle("dark", dark);
                document.documentElement.style.colorScheme = dark ? "dark" : "light";
            } catch (e) { /* never block rendering */ }
        })();
    </script>
    <title>Workout Challenge</title>
    <style>
        /* Reserve safe-area for the iPhone notch / home indicator so
           the app doesn't render under them on first paint. */
        :root { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
        body { padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); }
        html, body { overscroll-behavior-y: contain; }
        /* Don't let iOS auto-zoom inputs on focus. */
        input, textarea, select { font-size: 16px; }
        /* Pre-paint background so standalone launch never flashes white. */
        html { background: #f2f4ec; }
        html.dark { background: #0a0d06; }
    </style>
</head>
<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="root"></div>
</body>
</html>
