<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
    <meta name="theme-color" content="#0c4a6e"/>
    <title>Workout Challenge - Offline</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #f3f4f6; color: #111; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
        .card { max-width: 28rem; background: #fff; border-radius: 1rem; box-shadow: 0 8px 24px rgba(0,0,0,.08); padding: 2rem; text-align: center; }
        h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
        p { color: #4b5563; line-height: 1.5; margin: .5rem 0; }
        button { margin-top: 1rem; background: #0c4a6e; color: #fff; border: 0; padding: .75rem 1.25rem; border-radius: 999px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>You're offline</h1>
        <p>The Workout Challenge app needs a connection to load this page. Reconnect and try again.</p>
        <button onclick="location.reload()">Retry</button>
    </div>
</body>
</html>
