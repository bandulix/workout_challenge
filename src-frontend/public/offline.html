<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
    <meta name="theme-color" content="#0a0d06"/>
    <title>Workout Challenge - Offline</title>
    <style>
        body { font-family: 'Inter', -apple-system, system-ui, sans-serif; background: #0a0d06; color: #f4f6ee; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
        .card { max-width: 28rem; background: #161c0e; border: 1px solid #27331a; border-radius: 1.5rem; padding: 2rem; text-align: center; }
        img { width: 72px; height: 72px; border-radius: 50%; box-shadow: 0 0 24px rgba(215,255,62,.35); }
        h1 { font-size: 1.25rem; margin: 1rem 0 .5rem; text-transform: uppercase; letter-spacing: .08em; }
        p { color: #9aa78a; line-height: 1.5; margin: .5rem 0; }
        button { margin-top: 1rem; background: #d7ff3e; color: #0a0d06; border: 0; padding: .75rem 1.5rem; border-radius: 999px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/personas/sergeant.svg" alt="Coach"/>
        <h1>You're offline</h1>
        <p>Even the coach can't shout through a dead connection. Reconnect and report back.</p>
        <button onclick="location.reload()">Retry</button>
    </div>
</body>
</html>
