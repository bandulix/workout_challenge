# Working directory has to be the top directory "workout_challenge" that contains the sub-folders "src-frontend" and "src-backend"

[supervisord]
nodaemon=true

# Supervisord frontend (status / restart / stop of the processes below).
# Loopback-only inside the container and NOT published to the host - it
# has no authentication of its own, so exposing it would hand out
# unauthenticated process control. Use `docker compose exec
# workoutchallenge supervisorctl -c /etc/supervisord.conf status` instead.
[inet_http_server]
port = 127.0.0.1:9001
priority=100

# Redis sever for caching and celery backend. Localhost-only (no
# external clients exist) and running as the dedicated redis user -
# protected-mode is the only other thing standing between an SSRF and
# cache/broker poisoning.
[program:redis]
user=redis
directory=/var/lib/redis
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile_maxbytes=0
autorestart=true
priority=200
stopwaitsecs=20

# NOTE on readiness probes below: use 127.0.0.1, never "localhost".
# In the Alpine image /etc/hosts maps localhost to BOTH 127.0.0.1 and
# ::1, and busybox `nc` probes the IPv6 address first. Redis and
# gunicorn bind the IPv4 loopback only, so `nc -z localhost ...` gets
# refused on ::1 and the workers wait forever -> nginx 502s every /api
# request.

# Celery for Django for task queuing
[program:celery-worker]
user=app
directory=/workout_challenge/src-backend
command=sh -c 'while ! nc -z 127.0.0.1 6379 </dev/null; do echo "celery-worker waiting for redis at port :6379"; sleep 3; done && celery -A workout_challenge worker --loglevel INFO --without-mingle --without-gossip --autoscale=4,1 --events'
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile_maxbytes=0
autorestart=true
priority=300
stopwaitsecs=20

# Celery Beat for task scheduling
[program:celery-beat]
user=app
directory=/workout_challenge/src-backend
command=sh -c 'while ! nc -z 127.0.0.1 8000 </dev/null; do echo "celery-beat waiting for django at port :8000"; sleep 3; done && celery -A workout_challenge beat --scheduler django_celery_beat.schedulers:DatabaseScheduler --loglevel INFO'
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile_maxbytes=0
autorestart=true
priority=600
stopwaitsecs=20

# Celery Flower as frontend to view task que and task status.
# Basic auth is mandatory: Flower exposes task arguments (user data,
# email addresses) and task control. FLOWER_PASSWORD must be set and
# must differ from SECRET_KEY (compose + Django enforce this).
[program:celery-flower]
user=app
# CWD must stay src-backend (for the celery app import); --persistent
# would write flower.db there which is root-owned - point --db at the
# app-writable data volume instead.
directory=/workout_challenge/src-backend
command=sh -c 'while ! nc -z 127.0.0.1 6379 </dev/null; do echo "celery-flower waiting for redis at port :6379"; sleep 3; done && celery -A workout_challenge flower --persistent=True --db=/workout_challenge/src-backend/data/flower.db --basic-auth="${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?FLOWER_PASSWORD must be set and must differ from SECRET_KEY}"'
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile_maxbytes=0
autorestart=true
priority=400

# Backend Django
[program:backend-django]
user=app
directory=/workout_challenge/src-backend
# Migrations + collectstatic are intentionally run by the entrypoint
# script (see scripts/entrypoint.sh) before the workers boot. Running
# `migrate` here from supervisord had two problems: (1) with --workers=3
# every gunicorn worker raced to apply migrations on first start, and
# (2) `makemigrations` shouldn't be run in production at all - schema
# changes belong in the image build.
# Gunicorn binds loopback only: nginx proxies to it from inside the
# same container, so publishing :8000 just bypassed every nginx
# security header for no benefit.
# gunicorn is pinned to 23 (requirements.lock.txt). Do not pass
# --no-control-socket: that flag exists only on gunicorn 26+, and 23
# treats it as an unknown argument and exits (supervisor FATAL, nginx 502).
command=sh -c 'while ! nc -z 127.0.0.1 6379 </dev/null; do echo "django gunicorn waiting for redis at port :6379"; sleep 3; done && /usr/local/bin/gunicorn workout_challenge.wsgi:application --workers=3 --worker-class=gevent --chdir /workout_challenge/src-backend --bind 127.0.0.1:8000 --timeout 120'
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile_maxbytes=0
autorestart=true
priority=500
stopwaitsecs=20

# Nginx proxy for React frontend and backend redirect to gunicorn running Django
[program:nginx]
# Render config.js from env vars via a dedicated script so a malicious
# SENTRY_DSN/STRAVA_CLIENT_ID (containing ", /, or control chars)
# cannot break out of the JS string literal and inject script.
# Wrapped in sh -c so supervisord sees one foreground command and the
# '&&' chain keeps nginx attached to the tty.
command=sh -c '/usr/local/bin/render_config_js.py && exec /usr/sbin/nginx -g "daemon off;"'
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile_maxbytes=0
autorestart=true
priority=700