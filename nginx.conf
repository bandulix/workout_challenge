server {
    listen 80;

    # Don't leak the nginx version in error pages / Server header.
    server_tokens off;

    # Default 4x8k is too small for some request URIs (e.g. when the
    # frontend carries large join-link query strings or fat cookies).
    # 4x32k gives plenty of headroom without opening the door to
    # header-based attacks (each line still capped individually).
    large_client_header_buffers 4 32k;

    # ---- Security headers (apply to every response) ----
    # X-Frame-Options: keep clickjacking protection on every response
    # (the old config only added it inside the / location block).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Modern browsers ignore X-XSS-Protection but the legacy signal
    # still doesn't hurt and is required by some compliance checklists.
    add_header Referrer-Policy "same-origin" always;
    # Permissions-Policy: explicitly opt out of powerful APIs we never
    # use so a compromised dependency can't pivot to camera/mic/etc.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # HSTS. We emit this unconditionally; deployments that put this
    # image behind a TLS-terminating reverse proxy already want HSTS,
    # and anyone running HTTP-only without a proxy should remove this
    # line (or terminate TLS). Browsers seeing max-age=31536000 on a
    # plain HTTP origin will just ignore it.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content-Security-Policy: tight default for the SPA. The app
    # only needs same-origin JS/CSS, plus Sentry.io (errors) and
    # storage.googleapis.com / kofi.com (static assets/optional badge).
    # script-src has NO 'unsafe-inline': the frontend is built with
    # INLINE_RUNTIME_CHUNK=false and the pre-paint theme bootstrap lives
    # in an external file (/theme-init.js), so no inline scripts exist.
    # Inline styles are still required by React/Tailwind at runtime;
    # hash-based nonces would be ideal but require HTML rewriting that
    # nginx can't do. 'unsafe-eval' and inline event handlers are
    # explicitly blocked.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.sentry.io https://*.ingest.sentry.io https://*.strava.com https://www.strava.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Backend Django
    location /api/ {
        # 127.0.0.1, NOT "localhost": /etc/hosts maps localhost to both
        # 127.0.0.1 and ::1, nginx round-robins the two, and gunicorn
        # binds the IPv4 loopback only - every other attempt hit ::1,
        # got refused, and logged "upstream temporarily disabled".
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        # The Garmin SSO roundtrip on /api/garmin/link/ can take a while.
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # warn level: debug logged full request detail (URIs carrying
        # join tokens, header internals) into the container logs.
        error_log /var/log/nginx/api_error.log warn;
    }

    # Backend api static files
    # NOTE: no `add_header` in location blocks - any add_header here
    # would silently drop ALL server-level security headers (nginx
    # inheritance rule). `expires` alone emits Cache-Control safely.
    location /apistatic/ {
        alias /workout_challenge/src-backend/static/;  # Update this path to match your STATIC_ROOT
        expires 5d;
    }

    # User-uploaded media (profile pictures) - persisted in the django_data volume
    location /media/ {
        alias /workout_challenge/src-backend/data/media/;
        expires 1d;
    }

    # CRA build output: content-hashed JS/CSS/assets - cache long.
    location /static/ {
        root /usr/share/nginx/html;
        expires 30d;
    }

    # Persona artworks, fonts, icons: fingerprinted by release, safe to cache.
    location ~ ^/(personas|fonts)/ {
        root /usr/share/nginx/html;
        expires 7d;
    }

    # React frontend (HTML shell: never cache so deploys show up instantly)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        expires -1;
        try_files $uri /index.html;
    }

    # Catch all for any unmatched routes
    location @rewrites {
        rewrite ^(.+)$ /index.html last;
    }

}