<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="color-scheme" content="dark">
  <meta name="supported-color-schemes" content="dark">
  <title>{% block title %}{{ APP_NAME }}{% endblock %}</title>
  <!--[if mso]>
  <noscript><xml>
    <o:OfficeDocumentSettings xmlns:o="urn:schemas-microsoft-com:office:office">
      <o:PixelsPerInch>96</o:PixelsPerInch>
    </o:OfficeDocumentSettings>
  </xml></noscript>
  <![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#0b0b0c;">
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#0b0b0c;">
    {% block preview %}{% endblock %}
  </div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0b0b0c">
    <tr>
      <td align="center" style="padding:28px 12px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background-color:#141416;border:1px solid #2a2a32;border-radius:24px;">
          <tr>
            <td align="center" style="padding:28px 28px 18px;font-family:Arial,Helvetica,sans-serif;">
              <div style="font-size:11px;letter-spacing:0.28em;text-transform:uppercase;color:#a1a1aa;">{{ TAGLINE }}</div>
              <div style="padding-top:10px;font-size:28px;font-weight:800;letter-spacing:-0.03em;line-height:1.05;color:#f4f4f5;">WORKOUT<br><span style="color:#d7ff3e;">CHALLENGE</span></div>
            </td>
          </tr>
          <tr>
            <td style="height:3px;background-color:#d7ff3e;font-size:0;line-height:0;">&nbsp;</td>
          </tr>
          <tr>
            <td style="padding:24px 28px 8px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.55;color:#e4e4e7;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:8px 28px 28px;font-family:Arial,Helvetica,sans-serif;">
              {% block cta %}{% endblock %}
            </td>
          </tr>
        </table>
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;">
          <tr>
            <td align="center" style="padding:18px 12px 0;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:1.6;color:#6b6b73;">
              {{ APP_NAME }}
              <br>Issues? <a href="mailto:{{ EMAIL_REPLY_TO }}" style="color:#d7ff3e;text-decoration:none;">Email us</a>.
              <br><a href="{{ SOURCE_URL }}" style="color:#6b6b73;text-decoration:underline;">Source code</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
