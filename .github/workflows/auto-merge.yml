name: Auto-merge master/main back to dev branch

on:
  pull_request:
    types:
      - closed
    branches:
      - master
      - main

jobs:
  merge-master-back-to-dev:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # Explicit minimal token scope: this job pushes the back-merge to dev.
    permissions:
      contents: write
    steps:
      # Pinned to a commit SHA: mutable tags can be repointed to
      # malicious code (supply-chain). actions/checkout v4.2.2.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set Git config
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Github Actions"
      - name: Merge master back to dev
        run: |
          git fetch --unshallow
          git checkout dev
          git pull
          git merge --no-ff main -m "Auto-merge master/main branch back to dev"
          git push
