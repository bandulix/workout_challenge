name: restore-echoes-once
on:
  workflow_dispatch:
  push:
    branches: [fix/cr-bugs-24-28-clean]
    paths: ['.github/workflows/restore-echoes-once.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cr-bugs-24-28-clean
      - name: Apply echoes live-cap via python replace
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64
          p = Path("src-backend/drill_instructor/echoes.py")
          t = p.read_text()
          if "live_count >= MAX_LIVE_ECHOES" in t and "locked_config" in t:
              print("already patched")
          else:
              old = base64.b64decode("").decode()
              new = base64.b64decode("").decode()
              if old not in t:
                  raise SystemExit("old block missing")
              p.write_text(t.replace(old, new, 1))
              print("patched")
          text = p.read_text()
          assert "live_count >= MAX_LIVE_ECHOES" in text
          assert "locked_config" in text
          print("ok", len(text))
          PY
      - name: Commit + remove workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/restore-echoes-once.yml
          git add src-backend/drill_instructor/echoes.py
          git add -u .github/workflows/restore-echoes-once.yml
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "fix(drill_instructor): echo mint live-cap under select_for_update (#28)"
            git push
          fi
