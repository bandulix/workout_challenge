name: Development Deployment
on:
  push:
    branches: [ 'dev' ]
    paths-ignore: [ '.github/**', 'docs/**', 'README.md' ]

jobs:

  docker:
    runs-on: ubuntu-latest
    # Explicit minimal token scope: this job only reads the repo.
    permissions:
      contents: read
    steps:
      # All actions pinned to commit SHAs - mutable tags can be
      # repointed to malicious code that would exfiltrate the
      # DockerHub credentials used below (supply-chain hardening).
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392  # v3.6.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1
      - name: Login to DockerHub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: .
          platforms: linux/arm64/v8,linux/amd64
          push: true
          tags: ${{secrets.DOCKER_USER}}/workout_challenge:dev
