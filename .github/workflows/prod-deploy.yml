name: Production Deployment
on:
  pull_request:
    types:
      - closed
    branches:
      - master
      - main
    paths-ignore: [ '.github/**', 'docs/**', 'README.md' ]

jobs:

  autotag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # All actions pinned to commit SHAs - mutable tags can be
      # repointed to malicious code (supply-chain hardening).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        id: checkout
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: '0'

      - name: Bump version and push tag
        id: tagger
        # anothrNick/github-tag-action 1.71.0
        uses: anothrNick/github-tag-action@f278d49d30cdd8775cc3e7dd00b5ee11686ee297
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    outputs:
      out_tag: ${{ steps.tagger.outputs.tag }}
      out_new_tag: ${{ steps.tagger.outputs.new_tag }}
      out_part: ${{ steps.tagger.outputs.part }}


  docker:
    runs-on: ubuntu-latest
    needs: autotag
    # Explicit minimal token scope: this job only reads the repo.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392  # v3.6.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1
      - name: Login to DockerHub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: .
          platforms: linux/arm64/v8,linux/amd64
          push: true
          tags: ${{ secrets.DOCKER_USER }}/workout_challenge:latest,${{ secrets.DOCKER_USER }}/workout_challenge:${{ needs.autotag.outputs.out_tag }}


  release:
    runs-on: ubuntu-latest
    needs: [autotag, docker]
    # The release only goes out once the image actually built and
    # pushed - a tag without a working image would be a broken promise.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      # Auto-generated notes from the (conventional) commit messages;
      # docker-compose.yml + .env.example of exactly this version are
      # attached so a release is a complete one-command install for
      # self-hosters. Idempotent: re-runs don't fail on existing releases.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ needs.autotag.outputs.out_tag }}" >/dev/null 2>&1 || \
          gh release create "${{ needs.autotag.outputs.out_tag }}" \
            docker-compose.yml .env.example \
            --title "${{ needs.autotag.outputs.out_tag }}" \
            --generate-notes
