name: Production Deployment
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - master
      - main
    # docs-only PRs still skip the whole workflow. .github is NOT
    # ignored: a broken test job must be allowed to run itself.
    paths-ignore: [ 'docs/**', 'README.md' ]
  push:
    branches:
      - master
      - main
    paths-ignore: [ 'docs/**', 'README.md' ]
  # On-demand run, e.g. after a workflow-only push (paths-ignore would
  # otherwise swallow it) or to re-release without code changes.
  workflow_dispatch:

# Deploys (push / merge / dispatch) still serialize so autotag never
# races itself. PR test runs are isolated per PR and cancel on push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  test:
    # Must pass before autotag/docker. Also the only job that runs on
    # an open PR (autotag's `if` skips unmerged pull_request events).
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src-backend/requirements.lock.txt
      - name: Install backend dependencies
        working-directory: src-backend
        run: pip install -r requirements.lock.txt
      - name: Run backend tests
        working-directory: src-backend
        env:
          # DEBUG=true lets settings.py fall back to the well-known
          # dev SECRET_KEY if we forget one; we still set it explicitly.
          DEBUG: "true"
          SECRET_KEY: ci-test-not-a-real-secret-32bytes-min
        run: python manage.py test --settings=workout_challenge.test_settings --top-level-directory=. -v 1

  autotag:
    # Releases are deliberate. Push/PR only run `test`; cut a release
    # from the Actions UI (workflow_dispatch) so a merge cannot mint
    # 0.N.0 and an APK on its own.
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # All actions pinned to commit SHAs - mutable tags can be
      # repointed to malicious code (supply-chain hardening).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        id: checkout
        with:
          # PR merges check out the merge commit; plain pushes use github.sha.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: '0'

      - name: Bump version and push tag
        id: tagger
        # anothrNick/github-tag-action 1.71.0
        uses: anothrNick/github-tag-action@f278d49d30cdd8775cc3e7dd00b5ee11686ee297
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    outputs:
      out_tag: ${{ steps.tagger.outputs.tag }}
      out_new_tag: ${{ steps.tagger.outputs.new_tag }}
      out_part: ${{ steps.tagger.outputs.part }}


  docker:
    runs-on: ubuntu-latest
    needs: autotag
    # Minimal token scope: read the repo, push the image to ghcr.io.
    # GITHUB_TOKEN doubles as the registry login - no extra secrets needed.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392  # v3.6.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: .
          platforms: linux/arm64/v8,linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ needs.autotag.outputs.out_tag }}
          # Baked into the image as APP_VERSION - the "What's new" popup
          # compares it against the user's last-seen release.
          build-args: APP_VERSION=${{ needs.autotag.outputs.out_tag }}
          # Links the ghcr package back to this repo (shows on repo page).
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}


  apk:
    # Build the Android APK for exactly this release and attach it to the
    # GitHub Release - so every deployed version also ships a matching
    # app. Generic build (no baked backend URL): the app asks for the
    # server address once on first start, so one APK fits every instance.
    runs-on: ubuntu-latest
    needs: [autotag, docker, release]
    permissions:
      contents: write  # gh release upload
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: '0'  # full history: versionCode = commit count
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          # Capacitor 8 CLI requires Node >= 22 (npx cap sync dies on 20).
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src-frontend/package-lock.json
      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build web bundle (generic APK - no baked backend)
        working-directory: src-frontend
        env:
          # GitHub Actions sets CI=true, which makes the CRA build treat
          # ESLint *warnings* as fatal errors. Local builds (where CI is
          # unset) tolerate the existing warnings - keep CI identical to
          # local instead of letting the apk job die on them.
          CI: "false"
        run: npm ci && INLINE_RUNTIME_CHUNK=false npm run build && npx cap sync android
      - name: Install Android SDK platform 36
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
      - name: Set up release signing
        # Android refuses in-place updates when the signature changes.
        # Without signing material, every CI runner would generate a fresh
        # ephemeral debug keystore - EVERY release APK had a different
        # identity and no update path existed (uninstall/reinstall only,
        # losing app data). With the ANDROID_KEYSTORE_* secrets present,
        # CI signs with the same release key as local builds
        # (app/build.gradle auto-discovers ~/.gradle/workout-signing.properties).
        # Forks without the secrets keep the debug-key fallback.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_* secrets configured - release build falls back to the debug key."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/workout-release.keystore"
          mkdir -p ~/.gradle
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/workout-release.keystore"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > ~/.gradle/workout-signing.properties
          chmod 600 ~/.gradle/workout-signing.properties
      - name: Build the APK
        working-directory: src-frontend/android
        run: |
          VERSION_NAME="${{ needs.autotag.outputs.out_tag }}"
          VERSION_CODE="$(git rev-list --count HEAD)"
          ./gradlew assembleRelease --no-daemon \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"
          printf '{"versionName":"%s","versionCode":%s,"url":"/download/workout-challenge.apk"}\n' \
            "$VERSION_NAME" "$VERSION_CODE" > apk-version.json
      - name: Attach APK to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Rename BEFORE upload: gh's file#name syntax only sets the asset
        # *label* - the asset name stays the file's basename, and
        # update_apk_from_release.sh looks for exactly these names.
        run: |
          cp src-frontend/android/app/build/outputs/apk/release/app-release.apk \
             src-frontend/android/workout-challenge.apk
          gh release upload "${{ needs.autotag.outputs.out_tag }}" \
            src-frontend/android/workout-challenge.apk \
            src-frontend/android/apk-version.json \
            --clobber


  release:
    runs-on: ubuntu-latest
    needs: [autotag, docker]
    # The release only goes out once the image actually built and
    # pushed - a tag without a working image would be a broken promise.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # PR merges check out the merge commit; plain pushes use github.sha.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      # Auto-generated notes from the (conventional) commit messages;
      # docker-compose.yml + .env.example of exactly this version are
      # attached so a release is a complete one-command install for
      # self-hosters. Idempotent: re-runs don't fail on existing releases.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ needs.autotag.outputs.out_tag }}" >/dev/null 2>&1 || \
          gh release create "${{ needs.autotag.outputs.out_tag }}" \
            docker-compose.yml .env.example \
            --title "${{ needs.autotag.outputs.out_tag }}" \
            --generate-notes
